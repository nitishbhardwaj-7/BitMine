<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitMine — BTC Cloud Mining UI/UX Design System</title>
  <meta name="description" content="Production-ready UI/UX design language and interactive mobile prototype for BitMine — BTC Cloud Mining application.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236D35F5'><circle cx='12' cy='12' r='10'/><path d='M12 6v12M16 10H9.5a2.5 2.5 0 0 0 0 5H14' stroke='white' stroke-width='2'/></svg>">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/screens.css">
  <link rel="stylesheet" href="./css/simulator.css">
</head>
<body>
  <div class="app-viewport-root">
    <!-- Top Simulator Control Toolbar -->
    <header class="sim-toolbar">
      <div class="sim-brand">
        <div class="sim-logo-badge">₿</div>
        <div>
          <h1 class="sim-brand-title">BitMine — BTC Cloud Mining</h1>
          <p class="sim-brand-sub">UI/UX Design Language & Interactive Mobile Prototype</p>
        </div>
      </div>

      <div class="sim-controls-group">
        <!-- Mode Switcher -->
        <div class="sim-mode-toggle">
          <button class="sim-mode-btn active" id="btnModeSingle" title="Interactive mobile device simulator">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="2" width="14" height="20" rx="4"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Interactive Device
          </button>
          <button class="sim-mode-btn" id="btnModeGallery" title="View all 10 screens side-by-side (like reference photo)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
            10-Screen Grid
          </button>
        </div>

        <!-- Direct Screen Jumper -->
        <select class="screen-jumper-select" id="screenJumperSelect" aria-label="Jump directly to screen">
          <optgroup label="Main Bottom Tabs">
            <option value="home">1. Home (BitMine)</option>
            <option value="wallet">2. Wallet</option>
            <option value="miners">3. My Miners</option>
            <option value="market">4. Market</option>
            <option value="profile">5. Profile</option>
          </optgroup>
          <optgroup label="Secondary Detail Screens">
            <option value="miner-details">6. Miner Details</option>
            <option value="rewards">7. Rewards (Invite & Earn)</option>
            <option value="news">8. News</option>
            <option value="academy">9. Academy</option>
            <option value="settings">10. Settings</option>
          </optgroup>
        </select>
      </div>
    </header>

    <!-- 1. Single Interactive Simulator Stage -->
    <main class="single-simulator-stage" id="singleSimulatorStage">
      <div class="phone-chassis">
        <div class="phone-screen-inner">
          <!-- Dynamic Island -->
          <div class="dynamic-island">
            <div class="island-camera"></div>
            <div class="island-sensor"></div>
          </div>

          <!-- Status Bar -->
          <div class="phone-status-bar light-text" id="phoneStatusBar">
            <span>9:41</span>
            <div class="status-bar-icons">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.66-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 4h-3V2h-4v2H7v18h10V4z"/></svg>
            </div>
          </div>

          <!-- Active Screen Render Container -->
          <div id="activeScreenContainer" style="width: 100%; height: 100%;">
            <!-- Screen content injected dynamically via app.js -->
          </div>

          <!-- Floating Liquid-Glass Bottom Navigation Bar -->
          <div class="bm-bottom-nav-wrapper">
            <nav class="bm-bottom-nav" id="mainBottomNav" aria-label="Main Navigation">
              <div class="nav-item active" data-screen="home">
                <div class="nav-icon-container">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </div>
                <span class="nav-item-label">Home</span>
              </div>

              <div class="nav-item" data-screen="wallet">
                <div class="nav-icon-container">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                </div>
                <span class="nav-item-label">Wallet</span>
              </div>

              <div class="nav-item" data-screen="miners">
                <div class="nav-icon-container">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                </div>
                <span class="nav-item-label">Miners</span>
              </div>

              <div class="nav-item" data-screen="market">
                <div class="nav-icon-container">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
                </div>
                <span class="nav-item-label">Market</span>
              </div>

              <div class="nav-item" data-screen="profile">
                <div class="nav-icon-container">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
                </div>
                <span class="nav-item-label">Profile</span>
              </div>
            </nav>
          </div>

          <!-- Bottom Sheet Backdrop & Modal -->
          <div class="bm-bottom-sheet-backdrop" id="sheetBackdrop"></div>
          <div class="bm-bottom-sheet" id="mainBottomSheet">
            <div class="sheet-drag-handle" id="sheetDragHandle"></div>
            <div class="sheet-header-row">
              <h3 class="sheet-title" id="sheetTitle">Quick Action</h3>
              <button class="sheet-close-btn" id="sheetCloseBtn" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
            <div id="sheetBodyContent">
              <!-- Content injected dynamically -->
            </div>
          </div>

          <!-- Phone Home Indicator Bar -->
          <div class="phone-home-indicator"></div>
        </div>
      </div>
    </main>

    <!-- 2. Multi-Screen 10-Grid Gallery View (Matching User Reference Mockup) -->
    <section class="multi-gallery-stage" id="multiGalleryStage">
      <div class="gallery-section-header">
        <h2>BitMine — Complete 10-Screen UI/UX Architecture</h2>
        <p>Click any screen to open it interactively in the mobile device simulator</p>
      </div>
      <div class="screens-grid-container" id="screensGridContainer">
        <!-- 10 screens injected dynamically via app.js -->
      </div>
    </section>

    <!-- Toast Notification -->
    <div class="bm-toast" id="bmToast">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6D35F5" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      <span class="toast-msg">Action completed</span>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
