# BitMine production stack on one server: API + worker + Caddy (automatic HTTPS).
#
#   cp backend/.env.example deploy/.env   # then fill it in (see docs/DEPLOYMENT.md)
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# MongoDB is Atlas (not run here). Caddy terminates TLS and proxies to the API;
# TRUST_PROXY=uniquelocal tells the API to take the client IP from Caddy.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bitmine-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: uniquelocal
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  worker:
    image: bitmine-backend
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Your API hostname, e.g. api.bitmine.app (DNS A record → this server)
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
