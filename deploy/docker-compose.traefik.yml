# BitMine on a server that already runs Traefik (e.g. Dokploy), such as the
# production server: Traefik owns ports 80/443 and issues the certificate, so
# there is no Caddy here. The API joins Traefik's network and is routed by labels.
#
#   docker compose -f deploy/docker-compose.traefik.yml --env-file deploy/.env up -d --build
#
# Needs in deploy/.env: API_DOMAIN (e.g. bitmine.webflowby.online) plus the backend variables.

name: bitmine

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bitmine-backend
    container_name: bitmine-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Traefik reaches the API over the private overlay network.
      TRUST_PROXY: uniquelocal
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.bitmine-api.loadbalancer.server.port=4000
      # HTTPS
      - traefik.http.routers.bitmine-api.rule=Host(`${API_DOMAIN:?set API_DOMAIN in deploy/.env}`)
      - traefik.http.routers.bitmine-api.entrypoints=websecure
      - traefik.http.routers.bitmine-api.tls.certresolver=letsencrypt
      - traefik.http.routers.bitmine-api.service=bitmine-api
      # HTTP → HTTPS (middleware defined in Dokploy's middlewares.yml)
      - traefik.http.routers.bitmine-api-http.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.bitmine-api-http.entrypoints=web
      - traefik.http.routers.bitmine-api-http.middlewares=redirect-to-https@file
      - traefik.http.routers.bitmine-api-http.service=bitmine-api

  worker:
    image: bitmine-backend
    container_name: bitmine-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  dokploy-network:
    external: true
